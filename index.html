<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Release Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; color: #333; line-height: 1.5; }
        .section { margin-bottom: 25px; padding: 15px; background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 6px; }
        h3 { margin-top: 0; color: #0056b3; }
        textarea { width: 100%; height: 120px; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: monospace; font-size: 13px; white-space: pre; overflow: auto; }
        input[type="text"] { padding: 12px; width: 100%; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button { padding: 10px 20px; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; margin-bottom: 10px; }
        .btn-primary { background: #0056b3; font-size: 16px; }
        .btn-primary:hover { background: #004494; }
        .btn-secondary { background: #28a745; }
        .btn-secondary:hover { background: #218838; }
        .btn-danger { background: #dc3545; padding: 5px 10px; font-size: 12px; }
        .status-msg { font-weight: bold; margin-bottom: 15px; color: #666; padding: 10px; background: #e2e3e5; border-radius: 4px; }
        .result-card { border: 1px solid #dee2e6; padding: 15px; margin-bottom: 12px; border-radius: 6px; border-left: 5px solid #0056b3; background: #fff; }
        .result-card p { margin: 6px 0; }
        .error { color: #dc3545; }
        .success { color: #28a745; }
    </style>
</head>
<body>

    <h2>Grade Release Dashboard</h2>
    
    <div class="section">
        <h3>Step 1: Paste Data</h3>
        <p style="font-size: 13px; margin-top: -5px;">Copy rows directly from Excel (5 columns) <br><b>OR</b> paste raw, messy text directly from the PDF.</p>
        
        <textarea id="pasteArea" placeholder="Paste Excel rows here... OR paste the raw text from your PDF Gradesheet directly..."></textarea>
        
        <button class="btn-secondary" onclick="processPastedData()">Load Pasted Data</button>
        <button class="btn-danger" onclick="clearDatabase()">Clear System Memory</button>
    </div>

    <div id="status" class="status-msg">No data loaded yet.</div>
    
    <div class="section">
        <h3>Step 2: Search Student</h3>
        <input type="text" id="searchQuery" placeholder="Enter partial or full name (e.g., Alferez)">
        <button class="btn-primary" onclick="searchGrades()">View Grades</button>
    </div>
    
    <div id="results"></div>

    <script>
        // Master memory array
        let gradeData = [];

        function processPastedData() {
            const textArea = document.getElementById('pasteArea');
            let rawText = textArea.value.trim();
            const statusDiv = document.getElementById('status');

            if (!rawText) {
                statusDiv.innerHTML = '<span class="error">Error: The paste box is empty.</span>';
                return;
            }

            let addedCount = 0;
            let errorCount = 0;

            // Pre-cleaning: Fix merged grades/names like "1.50 AAUGUSTO" -> "1.50 A AUGUSTO"
            rawText = rawText.replace(/([1-5](?:\.\d{1,2})?)\s*([A-F][\+\-]?|INC|DRP)([A-ZÑ])/g, "$1 $2 $3");

            // DETECT FORMAT: If it contains tabs, treat it as standard Excel Paste
            if (rawText.includes('\t')) {
                const rows = rawText.split('\n');
                
                rows.forEach((row, index) => {
                    if (row.trim() === '') return;
                    const columns = row.split('\t').map(col => col.trim());

                    if (columns.length >= 5) {
                        gradeData.push({
                            studentName: columns[0],
                            subjectCode: columns[1],
                            subjectTitle: columns[2],
                            teacher: columns[3],
                            grade: columns[4]
                        });
                        addedCount++;
                    } else {
                        errorCount++;
                    }
                });

            } else {
                // PDF PLAIN TEXT PARSER
                let subjectCode = "N/A";
                let subjectTitle = "N/A";
                let teacher = "N/A";

                // 1. Extract Headers Adaptively
                const codeMatch = rawText.match(/(?:Subject Code\s+)?([A-Z0-9\-]+)?\s*Section\s+([A-Z0-9\-]+)/i);
                if (codeMatch) {
                    let codePart = codeMatch[1] ? codeMatch[1].trim() + " " : "";
                    subjectCode = codePart + "(" + codeMatch[2].trim() + ")";
                }

                const titleMatch = rawText.match(/(?:Subject Title\s+)?(.+?)\s+Day\s+[A-Za-z]/i);
                if (titleMatch) {
                    subjectTitle = titleMatch[1].trim();
                }

                const teacherMatch = rawText.match(/Instructor\s+(.+?)(?:\s+\||Room|\n|$)/i);
                if (teacherMatch) {
                    teacher = teacherMatch[1].trim();
                } else {
                    // Fallback if "Instructor" is missing (e.g., WINSLIE P. DADA | 24-512 Room SCLAB)
                    const teacherFallback = rawText.match(/([A-Z\.\sÑñ]+)\s+\|\s+.*?Room/i);
                    if (teacherFallback) teacher = teacherFallback[1].trim();
                }

                // 2. Extract Students robustly
                // Rules: Last Name, First Name (No numbers allowed) -> Sequence of middle grades/status -> Final Numeric Grade -> Final Letter Grade
                const studentRegex = /([^0-9,\n]{2,40}?,\s*[^0-9\n]{2,40}?)\s+((?:[\d\.]+\s*[a-zA-Z]*\s*)+)\s+([1-5](?:\.\d{1,2})?)\s+([A-F][\+\-]?|INC|DRP)/g;

                let match;
                let foundAny = false;

                while ((match = studentRegex.exec(rawText)) !== null) {
                    foundAny = true;
                    
                    let studentName = match[1].trim().replace(/\s+/g, ' '); 
                    
                    // Filter out header words that accidentally bleed in
                    studentName = studentName.replace(/GRADE|FINALGRD|STUDENT|NAME|LEC|LAB|Status|TotStud/gi, '').trim();

                    const finalNumericGrade = match[3]; 
                    const letterGrade = match[4];      

                    if (studentName.length > 2) {
                        gradeData.push({
                            studentName: studentName,
                            subjectCode: subjectCode,
                            subjectTitle: subjectTitle,
                            teacher: teacher,
                            grade: `${finalNumericGrade} (${letterGrade})` 
                        });
                        addedCount++;
                    }
                }

                if (!foundAny) {
                     statusDiv.innerHTML = '<span class="error">Failed to load. Could not detect valid student rows or headers from the text.</span>';
                     return;
                }
            }

            // Provide user feedback
            if (addedCount > 0) {
                let msg = `<span class="success">Success! Added ${addedCount} new student records. Total in memory: ${gradeData.length}.</span>`;
                if (errorCount > 0) {
                    msg += `<br><span class="error" style="font-size: 12px;">Note: Skipped ${errorCount} invalid Excel rows.</span>`;
                }
                statusDiv.innerHTML = msg;
                textArea.value = ''; // Clear the box
            } else {
                statusDiv.innerHTML = '<span class="error">Failed to load data. Ensure the format is correct.</span>';
            }
        }

        function searchGrades() {
            const query = document.getElementById('searchQuery').value.trim().toLowerCase();
            const resultsDiv = document.getElementById('results');
            
            resultsDiv.innerHTML = ''; 

            if (gradeData.length === 0) {
                alert("Please paste and load data first!");
                return;
            }

            if (!query) {
                resultsDiv.innerHTML = '<p class="error"><b>Please enter a name to search.</b></p>';
                return;
            }

            // Fuzzy match search
            const studentGrades = gradeData.filter(student => {
                if(student.studentName) {
                    return student.studentName.toLowerCase().includes(query);
                }
                return false;
            });

            if (studentGrades.length === 0) {
                resultsDiv.innerHTML = '<p>No matching records found.</p>';
                return;
            }

            studentGrades.forEach(record => {
                const card = document.createElement('div');
                card.className = 'result-card';
                card.innerHTML = `
                    <p><strong>Student:</strong> ${record.studentName}</p>
                    <p><strong>Subject:</strong> ${record.subjectCode} - ${record.subjectTitle}</p>
                    <p><strong>Teacher:</strong> ${record.teacher}</p>
                    <p><strong>Grade:</strong> <span style="font-size: 1.1em; font-weight: bold; color: #0056b3;">${record.grade}</span></p>
                `;
                resultsDiv.appendChild(card);
            });
        }

        function clearDatabase() {
            gradeData = [];
            document.getElementById('pasteArea').value = '';
            document.getElementById('searchQuery').value = '';
            document.getElementById('results').innerHTML = '';
            document.getElementById('status').innerText = "System memory cleared.";
        }
    </script>

</body>
</html>
