<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Release Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; color: #333; line-height: 1.5; }
        .section { margin-bottom: 25px; padding: 15px; background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 6px; }
        h3 { margin-top: 0; color: #0056b3; }
        textarea { width: 100%; height: 120px; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: monospace; font-size: 13px; white-space: pre; overflow: auto; }
        input[type="text"] { padding: 12px; width: 100%; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button { padding: 10px 20px; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; margin-bottom: 10px; }
        .btn-primary { background: #0056b3; font-size: 16px; }
        .btn-primary:hover { background: #004494; }
        .btn-secondary { background: #28a745; }
        .btn-secondary:hover { background: #218838; }
        .btn-danger { background: #dc3545; padding: 5px 10px; font-size: 12px; }
        .status-msg { font-weight: bold; margin-bottom: 15px; color: #666; padding: 10px; background: #e2e3e5; border-radius: 4px; }
        .result-card { border: 1px solid #dee2e6; padding: 15px; margin-bottom: 12px; border-radius: 6px; border-left: 5px solid #0056b3; background: #fff; }
        .result-card p { margin: 6px 0; }
        .error { color: #dc3545; }
        .success { color: #28a745; }
    </style>
</head>
<body>

    <h2>Grade Release Dashboard</h2>
    
    <div class="section">
        <h3>Step 1: Paste Data</h3>
        <p style="font-size: 13px; margin-top: -5px;">Paste rows directly from Excel <b>OR</b> raw text from PDF Gradesheets. The system will auto-detect the format.</p>
        
        <textarea id="pasteArea" placeholder="Paste data here..."></textarea>
        
        <button class="btn-secondary" onclick="processPastedData()">Load Pasted Data</button>
        <button class="btn-danger" onclick="clearDatabase()">Clear System Memory</button>
    </div>

    <div id="status" class="status-msg">No data loaded yet.</div>
    
    <div class="section">
        <h3>Step 2: Search Student</h3>
        <input type="text" id="searchQuery" placeholder="Enter partial or full name (e.g., Alicaba)">
        <button class="btn-primary" onclick="searchGrades()">View Grades</button>
    </div>
    
    <div id="results"></div>

    <script>
        // Master memory array
        let gradeData = [];

        function processPastedData() {
            const textArea = document.getElementById('pasteArea');
            const rawText = textArea.value.trim();
            const statusDiv = document.getElementById('status');

            if (!rawText) {
                statusDiv.innerHTML = '<span class="error">Error: The paste box is empty.</span>';
                return;
            }

            let addedCount = 0;
            let pdfTextBuffer = "";

            // 1. Process Line by Line to handle Excel formats cleanly
            const rawLines = rawText.split('\n');
            
            rawLines.forEach(line => {
                if (!line.trim()) return;

                const columns = line.split('\t').map(c => c.trim());
                
                // If it contains 4+ tabs, it is definitely copied from an Excel Spreadsheet
                if (columns.length >= 5 && line.includes('\t')) {
                    
                    // Skip header rows
                    if (line.toLowerCase().includes('student name')) return;

                    // Intelligently find the Name column (names usually have a comma)
                    let nameIdx = columns.findIndex(c => c.includes(',') && /[a-zA-Z]/.test(c));
                    if (nameIdx === -1) nameIdx = 0; // Fallback to first column

                    if (columns.length >= 8) {
                        // NEW EXCEL FORMAT (10-11 columns)
                        let numGrade = columns[columns.length - 2];
                        let letGrade = columns[columns.length - 1];
                        
                        gradeData.push({
                            studentName: columns[nameIdx],
                            subjectCode: "N/A", 
                            subjectTitle: "N/A",
                            teacher: "N/A",
                            grade: `${numGrade} (${letGrade})`
                        });
                        addedCount++;
                    } else {
                        // OLD EXCEL FORMAT (5 columns)
                        gradeData.push({
                            studentName: columns[0],
                            subjectCode: columns[1],
                            subjectTitle: columns[2],
                            teacher: columns[3],
                            grade: columns[4]
                        });
                        addedCount++;
                    }
                } else {
                    // It's not an Excel row, add to PDF buffer
                    pdfTextBuffer += line + "\n";
                }
            });

            // 2. Process whatever is left in the PDF Text Buffer
            if (pdfTextBuffer.trim() !== "") {
                
                // Extract Metadata from PDF
                let subjectCode = "N/A";
                let subjectTitle = "N/A";
                let teacher = "N/A";

                const codeMatch = pdfTextBuffer.match(/(?:Subject Code\s+)?([A-Z0-9\-]+)?\s*Section\s+([A-Z0-9\-]+)/i);
                if (codeMatch) subjectCode = (codeMatch[1] ? codeMatch[1].trim() + " " : "") + "(" + codeMatch[2].trim() + ")";

                const titleMatch = pdfTextBuffer.match(/(?:Subject Title\s+)?(.+?)\s+Day\s+[A-Za-z]/i);
                if (titleMatch) subjectTitle = titleMatch[1].trim();

                const teacherMatch = pdfTextBuffer.match(/Instructor\s+(.+?)(?:\s+\||Room|\n|$)/i);
                if (teacherMatch) {
                    teacher = teacherMatch[1].trim();
                } else {
                    const teacherFallback = pdfTextBuffer.match(/([A-Z\.\sÑñ]+)\s+\|\s+.*?Room/i);
                    if (teacherFallback) teacher = teacherFallback[1].trim();
                }

                // Pre-clean: Fix merged grades from PDF copy-pastes (e.g., "1.50 AVILLA" -> "1.50 A \n VILLA")
                let cleanText = pdfTextBuffer.replace(/([1-5](?:\.\d{1,2})?|INC|DRP|IC)\s*([A-F][\+\-]?|INC|DRP|IC)\s*([A-ZÑÃ])/g, "$1 $2\n$3");
                
                // Remove header keywords that might merge into names
                cleanText = cleanText.replace(/GRADE|FINALGRD|STUDENT|NAME|LEC|LAB|Status|TotStud/gi, ' ');

                // Robust PDF Regex: Looks for "Lastname, Firstname ... Numbers/Status ... Final Grade Letter"
                const studentRegex = /([A-Za-zÑñÃ\-\.\'‘ ]{2,40}?,\s*[A-Za-zÑñÃ\-\.\'‘ ]{2,40}?)\s+(?:(?:[\d\.]+|CO|IC|INC|DRP|[\w\+]+)\s+)+?([1-5](?:\.\d{1,2})?|INC|DRP|IC)\s+([A-F][\+\-]?|INC|DRP|IC)(?=\s|$|\n)/gi;

                let match;
                while ((match = studentRegex.exec(cleanText)) !== null) {
                    let studentName = match[1].trim().replace(/\s+/g, ' '); 
                    let finalNumericGrade = match[2]; 
                    let letterGrade = match[3];      

                    if (studentName.length > 2) {
                        gradeData.push({
                            studentName: studentName,
                            subjectCode: subjectCode,
                            subjectTitle: subjectTitle,
                            teacher: teacher,
                            grade: `${finalNumericGrade} (${letterGrade})` 
                        });
                        addedCount++;
                    }
                }
            }

            // Provide user feedback
            if (addedCount > 0) {
                statusDiv.innerHTML = `<span class="success">Success! Added ${addedCount} student records. Total in memory: ${gradeData.length}.</span>`;
                textArea.value = ''; // Clear the box
            } else {
                statusDiv.innerHTML = '<span class="error">Failed to load data. Could not detect valid Excel rows or PDF records.</span>';
            }
        }

        function searchGrades() {
            const query = document.getElementById('searchQuery').value.trim().toLowerCase();
            const resultsDiv = document.getElementById('results');
            
            resultsDiv.innerHTML = ''; 

            if (gradeData.length === 0) {
                alert("Please paste and load data first!");
                return;
            }

            if (!query) {
                resultsDiv.innerHTML = '<p class="error"><b>Please enter a name to search.</b></p>';
                return;
            }

            // Fuzzy match search
            const studentGrades = gradeData.filter(student => {
                if(student.studentName) {
                    return student.studentName.toLowerCase().includes(query);
                }
                return false;
            });

            if (studentGrades.length === 0) {
                resultsDiv.innerHTML = '<p>No matching records found.</p>';
                return;
            }

            studentGrades.forEach(record => {
                const card = document.createElement('div');
                card.className = 'result-card';
                card.innerHTML = `
                    <p><strong>Student:</strong> ${record.studentName}</p>
                    <p><strong>Subject:</strong> ${record.subjectCode} - ${record.subjectTitle}</p>
                    <p><strong>Teacher:</strong> ${record.teacher}</p>
                    <p><strong>Grade:</strong> <span style="font-size: 1.1em; font-weight: bold; color: #0056b3;">${record.grade}</span></p>
                `;
                resultsDiv.appendChild(card);
            });
        }

        function clearDatabase() {
            gradeData = [];
            document.getElementById('pasteArea').value = '';
            document.getElementById('searchQuery').value = '';
            document.getElementById('results').innerHTML = '';
            document.getElementById('status').innerText = "System memory cleared.";
        }
    </script>

</body>
</html>
