<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Release Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; color: #333; line-height: 1.5; }
        .section { margin-bottom: 25px; padding: 15px; background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 6px; }
        h3 { margin-top: 0; color: #0056b3; }
        textarea { width: 100%; height: 120px; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: monospace; font-size: 13px; white-space: pre; overflow: auto; }
        input[type="text"] { padding: 12px; width: 100%; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button { padding: 10px 20px; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; margin-bottom: 10px; }
        .btn-primary { background: #0056b3; font-size: 16px; }
        .btn-primary:hover { background: #004494; }
        .btn-secondary { background: #28a745; }
        .btn-secondary:hover { background: #218838; }
        .btn-danger { background: #dc3545; padding: 5px 10px; font-size: 12px; }
        .status-msg { font-weight: bold; margin-bottom: 15px; color: #666; padding: 10px; background: #e2e3e5; border-radius: 4px; }
        .result-card { border: 1px solid #dee2e6; padding: 15px; margin-bottom: 12px; border-radius: 6px; border-left: 5px solid #0056b3; background: #fff; }
        .result-card p { margin: 6px 0; }
        .error { color: #dc3545; }
        .success { color: #28a745; }
    </style>
</head>
<body>

    <h2>Grade Release Dashboard</h2>
    
    <div class="section">
        <h3>Step 1: Paste Excel Data</h3>
        <p style="font-size: 13px; margin-top: -5px;">Copy rows directly from Excel. Columns MUST be:<br><b>Name | Subj Code | Subj Title | Teacher | Grade</b></p>
        
        <textarea id="pasteArea" placeholder="Juan Dela Cruz    IT101    Linux Admin    Sir Ricky    1.5"></textarea>
        
        <button class="btn-secondary" onclick="processPastedData()">Load Pasted Data</button>
        <button class="btn-danger" onclick="clearDatabase()">Clear System Memory</button>
    </div>

    <div id="status" class="status-msg">No data loaded yet.</div>
    
    <div class="section">
        <h3>Step 2: Search Student</h3>
        <input type="text" id="searchQuery" placeholder="Enter partial or full name (e.g., Alferez)">
        <button class="btn-primary" onclick="searchGrades()">View Grades</button>
    </div>
    
    <div id="results"></div>

    <script>
        // Master memory array
        let gradeData = [];

        function processPastedData() {
            const textArea = document.getElementById('pasteArea');
            const rawText = textArea.value.trim();
            const statusDiv = document.getElementById('status');

            if (!rawText) {
                statusDiv.innerHTML = '<span class="error">Error: The paste box is empty.</span>';
                return;
            }

            // Split the text into individual rows
            const rows = rawText.split('\n');
            let addedCount = 0;
            let errorCount = 0;

            rows.forEach((row, index) => {
                // Skip completely blank lines
                if (row.trim() === '') return;

                // Excel data relies on tabs to separate columns (\t)
                const columns = row.split('\t').map(col => col.trim());

                // Check if the row has exactly or more than our 5 required columns
                if (columns.length >= 5) {
                    gradeData.push({
                        studentName: columns[0],
                        subjectCode: columns[1],
                        subjectTitle: columns[2],
                        teacher: columns[3],
                        grade: columns[4]
                    });
                    addedCount++;
                } else {
                    errorCount++;
                    console.warn(`Row ${index + 1} skipped. It did not have 5 distinct columns. Data seen:`, columns);
                }
            });

            // Provide user feedback
            if (addedCount > 0) {
                let msg = `<span class="success">Success! Added ${addedCount} new student records. Total in memory: ${gradeData.length}.</span>`;
                if (errorCount > 0) {
                    msg += `<br><span class="error" style="font-size: 12px;">Note: Skipped ${errorCount} invalid rows. Make sure you aren't copying empty spaces or headers.</span>`;
                }
                statusDiv.innerHTML = msg;
                textArea.value = ''; // Clear the box for the next paste
            } else {
                statusDiv.innerHTML = '<span class="error">Failed to load. Ensure you are copying 5 distinct columns from Excel.</span>';
            }
        }

        function searchGrades() {
            const query = document.getElementById('searchQuery').value.trim().toLowerCase();
            const resultsDiv = document.getElementById('results');
            
            resultsDiv.innerHTML = ''; 

            if (gradeData.length === 0) {
                alert("Please paste and load data first!");
                return;
            }

            if (!query) {
                resultsDiv.innerHTML = '<p class="error"><b>Please enter a name to search.</b></p>';
                return;
            }

            // Fuzzy match search
            const studentGrades = gradeData.filter(student => {
                if(student.studentName) {
                    return student.studentName.toLowerCase().includes(query);
                }
                return false;
            });

            if (studentGrades.length === 0) {
                resultsDiv.innerHTML = '<p>No matching records found.</p>';
                return;
            }

            studentGrades.forEach(record => {
                const card = document.createElement('div');
                card.className = 'result-card';
                card.innerHTML = `
                    <p><strong>Student:</strong> ${record.studentName}</p>
                    <p><strong>Subject:</strong> ${record.subjectCode} - ${record.subjectTitle}</p>
                    <p><strong>Teacher:</strong> ${record.teacher}</p>
                    <p><strong>Grade:</strong> <span style="font-size: 1.1em; font-weight: bold; color: #0056b3;">${record.grade}</span></p>
                `;
                resultsDiv.appendChild(card);
            });
        }

        function clearDatabase() {
            gradeData = [];
            document.getElementById('pasteArea').value = '';
            document.getElementById('searchQuery').value = '';
            document.getElementById('results').innerHTML = '';
            document.getElementById('status').innerText = "System memory cleared.";
        }
    </script>

</body>
</html>
