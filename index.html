<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Release Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; color: #333; line-height: 1.5; }
        .section { margin-bottom: 25px; padding: 15px; background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 6px; }
        h3 { margin-top: 0; color: #0056b3; }
        textarea { width: 100%; height: 120px; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: monospace; font-size: 13px; white-space: pre; overflow: auto; }
        input[type="text"] { padding: 12px; width: 100%; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button { padding: 10px 20px; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; margin-bottom: 10px; }
        .btn-primary { background: #0056b3; font-size: 16px; }
        .btn-primary:hover { background: #004494; }
        .btn-secondary { background: #28a745; }
        .btn-secondary:hover { background: #218838; }
        .btn-danger { background: #dc3545; padding: 5px 10px; font-size: 12px; }
        .status-msg { font-weight: bold; margin-bottom: 15px; color: #666; padding: 10px; background: #e2e3e5; border-radius: 4px; }
        .result-card { border: 1px solid #dee2e6; padding: 15px; margin-bottom: 12px; border-radius: 6px; border-left: 5px solid #0056b3; background: #fff; }
        .result-card p { margin: 6px 0; }
        .error { color: #dc3545; }
        .success { color: #28a745; }
        .count-badge { float: right; background: #e9ecef; padding: 3px 8px; border-radius: 12px; font-size: 12px; color: #555; }
    </style>
</head>
<body>

    <h2>Grade Release Dashboard</h2>
    
    <div class="section">
        <h3>Step 1: Paste Data</h3>
        <p style="font-size: 13px; margin-top: -5px;">Paste rows directly from Excel <b>OR</b> raw text from PDF Gradesheets. The system handles messy data automatically.</p>
        
        <textarea id="pasteArea" placeholder="Paste data here..."></textarea>
        
        <button class="btn-secondary" onclick="processPastedData()">Load Pasted Data</button>
        <button class="btn-danger" onclick="clearDatabase()">Clear System Memory</button>
    </div>

    <div id="status" class="status-msg">No data loaded yet.</div>
    
    <div class="section">
        <h3>Step 2: Search Student <span id="memoryCount" class="count-badge">0 in memory</span></h3>
        <input type="text" id="searchQuery" placeholder="Enter name OR leave blank to see all students">
        <button class="btn-primary" onclick="searchGrades()">View Grades</button>
    </div>
    
    <div id="results"></div>

    <script>
        // Master memory array
        let gradeData = [];

        function processPastedData() {
            const textArea = document.getElementById('pasteArea');
            const rawText = textArea.value.trim();
            const statusDiv = document.getElementById('status');
            const countBadge = document.getElementById('memoryCount');

            if (!rawText) {
                statusDiv.innerHTML = '<span class="error">Error: The paste box is empty.</span>';
                return;
            }

            let addedCount = 0;
            const rawLines = rawText.split('\n');

            let subjectCode = "N/A";
            let subjectTitle = "N/A";
            let teacher = "N/A";

            // 1. Try to extract Headers from the top lines
            for (let i = 0; i < Math.min(20, rawLines.length); i++) {
                let line = rawLines[i];
                
                let codeMatch = line.match(/(?:Subject Code\s+)?([A-Z0-9\-]+)?\s*Section\s+([A-Z0-9\-]+)/i);
                if (codeMatch) subjectCode = (codeMatch[1] ? codeMatch[1].trim() + " " : "") + "(" + codeMatch[2].trim() + ")";

                let titleMatch = line.match(/(?:Subject Title\s+)?(.+?)\s+Day\s+[A-Za-z]/i);
                if (titleMatch) subjectTitle = titleMatch[1].trim();

                let teacherMatch = line.match(/Instructor\s+(.+?)(?:\s+\||Room|$)/i);
                if (teacherMatch) teacher = teacherMatch[1].trim();
                else {
                    let tFallback = line.match(/([A-Z\.\sÑñ]+)\s+\|\s+.*?Room/i);
                    if (tFallback) teacher = tFallback[1].trim();
                }
            }

            // 2. Parse Students Line by Line
            rawLines.forEach(line => {
                line = line.trim();
                if (!line) return;

                // --- EXCEL FORMAT ---
                if (line.includes('\t')) {
                    const cols = line.split('\t').map(c => c.trim()).filter(c => c !== '');
                    if (cols.length < 4) return; 
                    if (line.toLowerCase().includes('student name')) return;

                    // Dynamically find the Name column (contains a comma)
                    let nameIdx = cols.findIndex(c => c.includes(',') && /[a-zA-Z]/.test(c));
                    if (nameIdx === -1) nameIdx = 0; // Fallback
                    
                    let studentName = cols[nameIdx];
                    let letGrade = cols[cols.length - 1]; // Last col
                    let numGrade = cols[cols.length - 2]; // Second to last col
                    
                    if (/\d/.test(numGrade) || letGrade.match(/[A-F]/i) || numGrade === "IC") {
                        gradeData.push({
                            studentName, subjectCode, subjectTitle, teacher,
                            grade: `${numGrade} (${letGrade})`
                        });
                        addedCount++;
                    }
                    return; 
                }

                // --- PDF FORMAT ---
                if (line.includes(',')) {
                    // Fix merged grades at the very end of the line (e.g. "1.50A" -> "1.50 A")
                    line = line.replace(/([1-5](?:\.\d{1,2})?|INC|DRP|IC)([A-F][\+\-]?|INC|DRP|IC)$/i, "$1 $2");

                    // Match Name at start (Last, First)
                    const nameMatch = line.match(/^([A-Za-zÑñÃ\-\.\'‘ ]+,\s*[A-Za-zÑñÃ\-\.\'‘ ]+)/);
                    // Match Grades at end (Numeric Letter)
                    const gradeMatch = line.match(/([1-5](?:\.\d{1,2})?|INC|DRP|IC)\s+([A-F][\+\-]?|INC|DRP|IC)$/i);

                    if (nameMatch && gradeMatch) {
                        let studentName = nameMatch[1].trim();
                        
                        // Prevent accidental header capture
                        if (!studentName.toLowerCase().includes('student name')) {
                            gradeData.push({
                                studentName, subjectCode, subjectTitle, teacher,
                                grade: `${gradeMatch[1]} (${gradeMatch[2]})`
                            });
                            addedCount++;
                        }
                    }
                }
            });

            // Provide user feedback
            if (addedCount > 0) {
                statusDiv.innerHTML = `<span class="success">Success! Added ${addedCount} student records. Total in memory: ${gradeData.length}.</span>`;
                countBadge.innerText = `${gradeData.length} in memory`;
                textArea.value = ''; 
            } else {
                statusDiv.innerHTML = '<span class="error">Failed to load data. Could not detect valid student rows.</span>';
            }
        }

        function searchGrades() {
            const query = document.getElementById('searchQuery').value.trim().toLowerCase();
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = ''; 

            if (gradeData.length === 0) {
                alert("Please paste and load data first!");
                return;
            }

            // IF BLANK SEARCH: Show all students
            let studentGrades = gradeData;

            // IF TEXT SEARCH: Filter by name
            if (query) {
                studentGrades = gradeData.filter(student => {
                    return student.studentName && student.studentName.toLowerCase().includes(query);
                });
            }

            if (studentGrades.length === 0) {
                resultsDiv.innerHTML = '<p class="error">No matching records found.</p>';
                return;
            }

            // Display results
            studentGrades.forEach(record => {
                const card = document.createElement('div');
                card.className = 'result-card';
                card.innerHTML = `
                    <p><strong>Student:</strong> ${record.studentName}</p>
                    <p><strong>Subject:</strong> ${record.subjectCode} - ${record.subjectTitle}</p>
                    <p><strong>Teacher:</strong> ${record.teacher}</p>
                    <p><strong>Grade:</strong> <span style="font-size: 1.1em; font-weight: bold; color: #0056b3;">${record.grade}</span></p>
                `;
                resultsDiv.appendChild(card);
            });
        }

        function clearDatabase() {
            gradeData = [];
            document.getElementById('pasteArea').value = '';
            document.getElementById('searchQuery').value = '';
            document.getElementById('results').innerHTML = '';
            document.getElementById('status').innerText = "System memory cleared.";
            document.getElementById('memoryCount').innerText = "0 in memory";
        }
    </script>

</body>
</html>
